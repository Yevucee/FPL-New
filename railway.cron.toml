# Cron service config — create a second Railway service from the same repo
# and set Config File Path to `railway.cron.toml` in service settings.
[build]
builder = "RAILPACK"
buildCommand = "npm ci"

[deploy]
startCommand = "npm run job:automated-sync"
# Hourly during the season — live-ish GW scores without hammering the FPL API.
cronSchedule = "0 * * * *"
restartPolicyType = "NEVER"

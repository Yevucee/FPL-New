# GitHub Actions cannot read secret values from another repository.
# Copy FPL_LEAGUE_ID from Swiss-Expert-League repo secrets (same numeric ID
# as in fantasy.premierleague.com/leagues/<ID>/standings/c).
#
# Required secrets on Yevucee/FPL-New:
#   FPL_LEAGUE_ID      — classic league ID (same as Swiss-Expert-League)
#   DATABASE_URL       — Railway Postgres private URL
#
# Optional:
#   RAILWAY_TOKEN      — project token to push LEAGUE_PROVIDER_ID to Railway services

name: Sync FPL → Railway

on:
  workflow_dispatch:
  schedule:
    # Twice daily UTC — complements Railway cron; disable one if redundant
    - cron: "15 6,18 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch from FPL and import to Postgres
        env:
          LEAGUE_PROVIDER_ID: ${{ secrets.FPL_LEAGUE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FANTASY_PROVIDER_MODE: manual
          LEAGUE_SLUG: swiss-expert-league
          LEAGUE_DISPLAY_NAME: Swiss Expert League
          LEAGUE_SHORT_NAME: SEL
          APP_TIMEZONE: Europe/Zurich
          SCORING_TIMEZONE: Europe/London
          SNAPSHOT_PATH: data/league-snapshot.json
        run: npm run sync:fpl
